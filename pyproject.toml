[project]
name = "genui"
version = "0.3.0"
description = "基于大模型的动态UI生成库, 根据用户描述生成可交互的界面"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "colorlog>=6.8.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
anthropic = ["langchain-anthropic>=0.3.0,<2.0.0"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
