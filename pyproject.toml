[project]
name = "genui"
version = "0.4.0"
description = "基于大模型的动态UI生成库, 根据用户描述生成可交互的界面"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "genui contributors"}
]
keywords = ["ui", "llm", "generative", "dynamic-ui", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: User Interfaces",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langchain-core>=0.3.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "colorlog>=6.8.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0,<2.0.0"]

[project.scripts]
genui = "genui.__main__:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
