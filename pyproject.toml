[project]
name = "genui"
version = "0.1.0"
description = "基于大模型的动态UI生成库, 根据用户描述生成可交互的界面"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.34.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
